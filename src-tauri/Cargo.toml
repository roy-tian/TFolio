# The engine is a crate of its own so no Tauri type can reach it. Listed as a
# default member so every command run on this manifest covers it too.
[workspace]
members = ["engine"]
default-members = [".", "engine"]

[package]
name = "tfolio"
version = "0.1.16"
description = "TFolio PDF Editor"
authors = ["Roy Tian"]
license = "MIT"
edition = "2021"

[lib]
name = "tfolio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The one transform between a signed release and the two strings that check
# it: both the key and the signature reach this app base64-wrapped. Already
# in the tree under the updater plugin, so this names it rather than adds it.
base64 = "0.22"
# Encodes the pages the engine renders as pixels into what the WebView
# decodes. Already in the tree under the engine, so this names it rather than
# adds it.
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
# What lets a downloaded installer outlive the run that fetched it. The
# updater plugin checks the signature over bytes it never writes down and
# keeps that check private, so a saved package is checked again here — with
# the same crate the plugin itself verifies with.
minisign-verify = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
# The release check. Its network call, its signature check and its install are
# all Rust-side: the WebView is granted none of the plugin's own commands, so
# the endpoint and the key its bytes must match stay compiled-in rather than
# nameable from the page. `rustls` again, so this adds no second TLS backend.
tauri-plugin-updater = "2"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
tfolio-engine = { path = "engine" }
# The settings file's format. Already in the tree — `tauri-build` reads
# `tauri.conf.json`'s Cargo side with it — so naming it here adds a name,
# not a dependency.
toml = "1"

# Where a file the reader double-clicked arrives, on the two platforms whose
# answer to "open this with TFolio" is a second TFolio: it hands that process's
# arguments to the one already running. macOS names the file to the running app
# itself — `RunEvent::Opened`, no plugin — so it is left out there rather than
# paying for zbus and a socket it would never use.
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
window-vibrancy = "0.8.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAppearance", "NSWindow"] }

[profile.dev.package.allsorts]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Every page the reader sees is encoded by these on the way out; at the size
# profile's "s" the PNG encode measured about 1.7 times slower than at 3.
[profile.release.package.png]
opt-level = 3

[profile.release.package.fdeflate]
opt-level = 3

[profile.release.package.crc32fast]
opt-level = 3

[profile.release.package.simd-adler32]
opt-level = 3

[profile.release.package.image]
opt-level = 3

# Every thumbnail goes out through its WebP encoder, the same hot path.
[profile.release.package.image-webp]
opt-level = 3

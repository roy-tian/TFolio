name: CI

# A branch with an open pull request would otherwise run twice per push, once
# for each event, in concurrency groups that never cancel each other. Changes
# confined to the ignored paths cannot affect anything these jobs check.
on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "website/**"
      - ".agents/**"
      - ".claude/**"
      - ".github/workflows/bundle-dry-run.yml"
      - ".github/workflows/release.yml"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "website/**"
      - ".agents/**"
      - ".claude/**"
      - ".github/workflows/bundle-dry-run.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

# Release waits on the default branch's run for its exact commit, so a later
# push there must neither cancel it nor displace it while pending: group those
# runs by commit instead of by branch.
concurrency:
  group: ci-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Check synchronized version
        run: bun run version:check

      - name: Run frontend tests
        run: bun run test

      - name: Build frontend
        run: bun run build

  rust:
    name: Rust
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # The ignored PDFium tests can fall back to system fonts; give them the
      # same CJK face the E2E job installs.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev fonts-wqy-zenhei

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      # Clippy type-checks the same targets, so a separate `cargo check` adds nothing.
      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings

      # Running the ignored tests here reuses this job's test build; the
      # download scripts need only Bun, not the frontend dependencies.
      - name: Download PDFium runtime and test fonts
        run: bun run pdfium:download && bun run fonts:download

      - name: Run Rust tests, including PDFium integration tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked -- --include-ignored

  e2e:
    name: GUI E2E
    needs: [frontend, rust]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev xvfb fonts-wqy-zenhei

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: bun ci

      - name: Build GUI test application
        run: bun run test:e2e:build

      - name: Run GUI tests with Xvfb
        env:
          NO_AT_BRIDGE: "1"
          FONTCONFIG_FILE: ${{ github.workspace }}/test/e2e/fontconfig.conf
        run: bun run test:e2e:headless

      - name: Upload GUI failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: gui-e2e-artifacts
          path: artifacts/e2e/
          if-no-files-found: ignore
